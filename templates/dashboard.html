<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accident Claim Insurance Analytics & Predictor</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
        .charts { display: flex; gap: 20px; margin-top: 30px; }
        .chart-box { flex: 1; min-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accident Claim Insurance Analytics & Predictor</h1>
        
        <h2>Predict Claim Status</h2>
        <form id="claimForm">
            <div class="form-group">
                <label for="age">Policyholder Age:</label>
                <input type="number" id="age" name="Age" value="35" required>
            </div>
            <div class="form-group">
                <label for="claim_amount">Claim Amount ($):</label>
                <input type="number" id="claim_amount" name="Claim_Amount" value="5000" required>
            </div>
            <div class="form-group">
                <label for="incident_severity">Incident Severity Index (1-5):</label>
                <input type="number" id="incident_severity" name="Incident_Severity" value="3" required>
            </div>
            <button type="submit">Predict Claim Status</button>
        </form>

        <div id="result"></div>

        <hr style="margin-top: 40px;">

        <h2>Exploratory Visualizations</h2>
        <div class="charts">
            <div id="chart1" class="chart-box"></div>
            <div id="chart2" class="chart-box"></div>
        </div>
    </div>

    <script>
        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payload = {
                Age: parseFloat(document.getElementById('age').value),
                Claim_Amount: parseFloat(document.getElementById('claim_amount').value),
                Incident_Severity: parseFloat(document.getElementById('incident_severity').value)
            };

            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([payload])
            });

            const result = await response.json();
            const outputDiv = document.getElementById('result');
            
            if (result.predictions[0] === 1) {
                outputDiv.style.color = 'green';
                outputDiv.innerText = 'Prediction: Claim Approved ✔';
            } else {
                outputDiv.style.color = 'red';
                outputDiv.innerText = 'Prediction: Claim Denied ✖';
            }
        });

        const claimStatusData = [{
            x: ['Approved (1)', 'Denied (0)'],
            y: [6, 4],
            type: 'bar',
            marker: { color: ['#28a745', '#dc3545'] }
        }];
        Plotly.newPlot('chart1', claimStatusData, { title: 'Historical Claims Summary' });

        const severityVsClaim = [{
            x: [1, 2, 3, 4, 5],
            y: [1500, 2500, 5000, 8000, 12000],
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#007bff' }
        }];
        Plotly.newPlot('chart2', severityVsClaim, { title: 'Avg Claim Amount vs Incident Severity' });
    </script>
</body>
</html>
